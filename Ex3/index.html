<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 - Sticky Header & Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>My Website</h1>
    <button class="btn-open">Đăng ký</button>
  </header>

  <main class="content">
    <p>Nội dung dài...</p>
  </main>

  <a href="#" class="btn-top">↑</a>

  <div class="overlay">
    <div class="modal">
      <button class="btn-close">✕</button>
      <h2>Đăng ký nhận tin</h2>
      <input type="email" placeholder="Nhập email">
      <button>Gửi</button>
    </div>
  </div>

</body>
</html>
