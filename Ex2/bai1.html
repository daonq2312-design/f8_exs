<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng tập 1</title>
    <style>
        /* 1. Selector ID: Định dạng phần tử duy nhất có id="tieu-de" */
        #tieu-de {
            color: #1a1a1a;
            font-size: 26px;
            text-align: center;
            margin: 20px;
        }

        /* 2. Selector Thẻ (Tag): Định dạng cho các thẻ table, th, td */
        table {
            width: 700px;
            margin: 20px auto;
            border: 1px solid #333333;
        }

        th {
            background-color: #2c3e50;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            padding: 10px;
            border: 1px solid #333333;
        }

        td {
            color: #333333;
            font-size: 15px;
            text-align: center;
            padding: 8px;
            border: 1px solid #cccccc;
        }

        /* 3. Selector Class: Làm nổi bật các học viên có điểm trung bình >= 8 */
        .diem-cao {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <!-- Tiêu đề trang h1 với id="tieu-de" -->
    <h1 id="tieu-de">Bảng điểm lớp HTML01</h1>

    <!-- Bảng điểm tạo bằng thẻ table -->
    <table>
        <!-- Dòng đầu tiên (tiêu đề cột) dùng thẻ th -->
        <tr>
            <th>STT</th>
            <th>Họ và tên</th>
            <th>HTML</th>
            <th>CSS</th>
            <th>Điểm trung bình</th>
        </tr>

        <!-- Dòng 1: Nguyễn Văn An - ĐTB 8.5 (>= 8 -> class diem-cao) -->
        <tr class="diem-cao">
            <td>1</td>
            <td>Nguyễn Văn An</td>
            <td>8</td>
            <td>9</td>
            <td>8.5</td>
        </tr>

        <!-- Dòng 2: Trần Thị Bình - ĐTB 6.5 -->
        <tr>
            <td>2</td>
            <td>Trần Thị Bình</td>
            <td>7</td>
            <td>6</td>
            <td>6.5</td>
        </tr>

        <!-- Dòng 3: Lê Văn Cường - ĐTB 9 (>= 8 -> class diem-cao) -->
        <tr class="diem-cao">
            <td>3</td>
            <td>Lê Văn Cường</td>
            <td>9</td>
            <td>9</td>
            <td>9</td>
        </tr>

        <!-- Dòng 4: Phạm Thị Dung - ĐTB 6 -->
        <tr>
            <td>4</td>
            <td>Phạm Thị Dung</td>
            <td>5</td>
            <td>7</td>
            <td>6</td>
        </tr>

        <!-- Dòng 5: Hoàng Văn Em - ĐTB 8 (>= 8 -> class diem-cao) -->
        <tr class="diem-cao">
            <td>5</td>
            <td>Hoàng Văn Em</td>
            <td>8</td>
            <td>8</td>
            <td>8</td>
        </tr>
    </table>
</body>
</html>
